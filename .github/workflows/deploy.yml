name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the PDF freshness check

      # The PDF and README image are generated locally with `pnpm pdf` and committed, so the published
      # files are exactly the ones that were checked. Refuse to deploy if the content changed after them.
      - name: Check the committed PDF and README image are up to date
        run: |
          src=$(git log -1 --format=%ct -- src scripts)
          for out in 'public/*.pdf' .github/resume.png; do
            built=$(git log -1 --format=%ct -- "$out")
            if [ -z "$built" ] || [ "$src" -gt "$built" ]; then
              echo "::error::src/ or scripts/ changed after $out was last committed. Run 'pnpm pdf' and commit its output."
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the PDF freshness check

      # The PDF is generated locally with `pnpm pdf` and committed, so the deployed file is
      # exactly the one that was checked. Refuse to deploy if the content changed after it.
      - name: Check the committed PDF is up to date
        run: |
          pdf=$(git log -1 --format=%ct -- 'public/*.pdf')
          src=$(git log -1 --format=%ct -- src scripts)
          if [ -z "$pdf" ] || [ "$src" -gt "$pdf" ]; then
            echo "::error::src/ or scripts/ changed after the PDF was last committed. Run 'pnpm pdf' and commit public/*.pdf."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
